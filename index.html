<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Number Pyramid Quest</title>
  <style>
    :root {
      --ink: #17233b;
      --muted: #657188;
      --paper: rgba(255, 255, 255, 0.88);
      --navy: #243b68;
      --blue: #4e7cff;
      --violet: #885cff;
      --gold: #f5b544;
      --mint: #2bc49a;
      --line: #dbe4f4;
      --shadow: 0 22px 55px rgba(48, 70, 124, 0.16);
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      font-family: "Nunito", "Avenir Next", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background:
        radial-gradient(circle at 13% 13%, rgba(93, 201, 255, 0.48), transparent 24rem),
        radial-gradient(circle at 87% 78%, rgba(187, 126, 255, 0.40), transparent 26rem),
        linear-gradient(135deg, #eaf6ff 0%, #f9f8ff 48%, #fff6e6 100%);
      color: var(--ink);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 16px 36px;
      margin: 0;
      min-height: 100vh;
    }

    .app-shell { width: min(100%, 820px); }

    header {
      text-align: center;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 7px;
      font-size: clamp(2.15rem, 6vw, 3.25rem);
      line-height: .95;
      letter-spacing: -0.06em;
      color: #1d2d50;
    }

    p.subtitle {
      color: var(--muted);
      margin: 0 0 15px;
      font-size: 1.03rem;
      max-width: 600px;
      line-height: 1.4;
    }

    /* Toggle Selector */
    .mode-toggle-container {
      display: inline-flex;
      background: rgba(255,255,255,.68);
      padding: 5px;
      border-radius: 15px;
      border: 1px solid rgba(255,255,255,.95);
      box-shadow: 0 7px 17px rgba(50,72,126,.09);
      gap: 5px;
    }

    .mode-btn {
      padding: 9px 18px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font-size: .92rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mode-btn.active {
      background: linear-gradient(135deg, var(--blue), var(--violet));
      color: white;
      box-shadow: 0 5px 12px rgba(95,100,226,.28);
    }

    .game-card {
      position: relative;
      overflow: hidden;
      background: var(--paper);
      backdrop-filter: blur(13px);
      padding: 25px 30px 27px;
      border-radius: 30px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      border: 1px solid rgba(255,255,255,.9);
      width: 100%;
      max-width: 820px;
    }

    .game-card::before { content:""; position:absolute; width:260px; height:260px; border-radius:50%; background:rgba(108,144,255,.09); top:-145px; right:-98px; pointer-events:none; }

    .quest-bar { width:100%; display:flex; align-items:center; justify-content:space-between; gap:16px; padding-bottom: 15px; border-bottom:1px solid var(--line); }
    .quest-label { display:flex; align-items:center; gap:10px; font-weight:900; font-size:.82rem; letter-spacing:.07em; text-transform:uppercase; color:var(--navy); }
    .quest-icon { width:32px; height:32px; display:grid; place-items:center; border-radius:10px; background:linear-gradient(135deg,#ffe594,#f7b64c); box-shadow:0 4px 10px rgba(245,181,68,.28); font-size:1rem; }
    .progress-wrap { width:150px; text-align:right; }
    .progress-copy { font-weight:800; font-size:.77rem; color:var(--muted); margin-bottom:6px; }
    .progress-track { height:8px; border-radius:99px; background:#e8eef9; overflow:hidden; }
    .progress-fill { width:0; height:100%; border-radius:inherit; background:linear-gradient(90deg,var(--mint),#6fdbb5); transition:width .25s ease; }

    /* 6-Tier Pyramid */
    .pyramid {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 9px;
      width: 100%;
    }

    .pyramid-tier {
      display: flex;
      justify-content: center;
      gap: 9px;
      width: 100%;
    }

    .cell-slot {
      width: 72px;
      height: 62px;
      position: relative;
    }

    .block-given {
      width: 100%;
      height: 100%;
      background: linear-gradient(145deg, #e8eeff, #dce6ff);
      color: #2f4a81;
      border: 1px solid #cbd9f5;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      font-weight: 900;
      box-shadow: 0 5px 11px rgba(63,88,150,.12);
    }

    .cell-slot[data-idx="0"] .block-given {
      background: linear-gradient(145deg, #fff3c6, #ffdf86);
      border: 1px solid #efbd4d;
      color: #755113;
      box-shadow: 0 5px 12px rgba(235,177,47,.23);
    }

    input.block-input {
      width: 100%;
      height: 100%;
      border-radius: 15px;
      border: 2px solid #9ab8ff;
      background-color: rgba(255,255,255,.92);
      color: #3c65d7;
      text-align: center;
      font-size: 1.2rem;
      font-weight: 900;
      outline: none;
      transition: all 0.15s ease;
      -moz-appearance: textfield;
      box-shadow: 0 5px 11px rgba(79,116,207,.11);
    }

    input.block-input::-webkit-outer-spin-button,
    input.block-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    input.block-input:focus {
      border-color: var(--violet);
      box-shadow: 0 0 0 4px rgba(136,92,255,.16), 0 7px 14px rgba(79,70,229,.18);
      transform: translateY(-2px) scale(1.035);
      z-index: 10;
    }

    input.block-input.correct {
      border-color: var(--mint);
      color: #13866a;
      background: #e6faf4;
      box-shadow: 0 5px 12px rgba(43,196,154,.18);
    }

    .actions {
      display: flex;
      gap: 12px;
      width: 100%;
      max-width: 470px;
    }

    .action-btn {
      flex: 1;
      padding: 13px 18px;
      border: none;
      border-radius: 14px;
      font-weight: 900;
      cursor: pointer;
      font-size: 1.05rem;
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
    }

    .action-btn:active {
      transform: translateY(1px) scale(.985);
    }

    .btn-new {
      background: linear-gradient(135deg, var(--blue), var(--violet));
      color: white;
      box-shadow: 0 8px 16px rgba(91,92,220,.25);
    }

    .btn-new:hover {
      transform: translateY(-2px);
      box-shadow: 0 11px 20px rgba(91,92,220,.32);
    }

    .btn-clear {
      background: #edf2fb;
      color: #49607f;
    }

    .btn-clear:hover {
      background: #dfe8f7;
    }

    .status-banner {
      font-size: 1rem;
      font-weight: 900;
      min-height: 26px;
      text-align: center;
    }

    .status-banner.win {
      color: #168b6e;
      animation: win-pop .45s ease both;
    }
    @keyframes win-pop { 0%{transform:scale(.93);opacity:.3} 70%{transform:scale(1.035)} 100%{transform:scale(1);opacity:1} }

    @media (max-width: 540px) {
      .cell-slot {
        width: 48px;
        height: 48px;
      }
      .block-given, input.block-input {
        font-size: 0.9rem;
      }
      .game-card {
        padding: 18px 7px 21px;
      }
      .quest-bar { padding:0 6px 13px; }
      .quest-label { font-size:.72rem; }
      .progress-wrap { width:110px; }
      .mode-btn { padding:9px 11px; font-size:.8rem; }
    }
  </style>
</head>
<body>
  <main class="app-shell">
  <header>
    <h1>Number Pyramid</h1>
    <p class="subtitle">Each block is the sum of the two blocks directly beneath it.</p>
    
    <div class="mode-toggle-container">
      <button class="mode-btn active" id="btn-mode-3">3-Digit Apex</button>
      <button class="mode-btn" id="btn-mode-4">4-Digit Apex (up to 9999)</button>
    </div>
  </header>

  <div class="game-card">
    <div class="quest-bar">
      <div class="quest-label"><span class="quest-icon">🔺</span> Pyramid Quest</div>
      <div class="progress-wrap">
        <div class="progress-copy" id="progress-copy">0 of 15 solved</div>
        <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      </div>
    </div>
    <div class="pyramid">
      <div class="pyramid-tier">
        <div class="cell-slot" data-idx="0"></div>
      </div>
      <div class="pyramid-tier">
        <div class="cell-slot" data-idx="1"></div>
        <div class="cell-slot" data-idx="2"></div>
      </div>
      <div class="pyramid-tier">
        <div class="cell-slot" data-idx="3"></div>
        <div class="cell-slot" data-idx="4"></div>
        <div class="cell-slot" data-idx="5"></div>
      </div>
      <div class="pyramid-tier">
        <div class="cell-slot" data-idx="6"></div>
        <div class="cell-slot" data-idx="7"></div>
        <div class="cell-slot" data-idx="8"></div>
        <div class="cell-slot" data-idx="9"></div>
      </div>
      <div class="pyramid-tier">
        <div class="cell-slot" data-idx="10"></div>
        <div class="cell-slot" data-idx="11"></div>
        <div class="cell-slot" data-idx="12"></div>
        <div class="cell-slot" data-idx="13"></div>
        <div class="cell-slot" data-idx="14"></div>
      </div>
      <div class="pyramid-tier">
        <div class="cell-slot" data-idx="15"></div>
        <div class="cell-slot" data-idx="16"></div>
        <div class="cell-slot" data-idx="17"></div>
        <div class="cell-slot" data-idx="18"></div>
        <div class="cell-slot" data-idx="19"></div>
        <div class="cell-slot" data-idx="20"></div>
      </div>
    </div>

    <div class="status-banner" id="status"></div>

    <div class="actions">
      <button class="action-btn btn-clear" id="btn-clear">↺ Clear answers</button>
      <button class="action-btn btn-new" id="btn-new">✨ New Pyramid</button>
    </div>
  </div>
  </main>

  <script>
    // 21 blocks total across 6 tiers
    let currentValues = new Array(21).fill(0);
    let revealedMask = new Array(21).fill(false);
    let currentMode = "3digit"; // "3digit" or "4digit"

    function getIndex(tier, pos) {
      return (tier * (tier + 1)) / 2 + pos;
    }

    function generatePyramid() {
      // In a 6-tier pyramid, Pascal multiplier is:
      // Apex = 1*B0 + 5*B1 + 10*B2 + 10*B3 + 5*B4 + 1*B5 (sum multiplier = 32)
      let minBase, maxBase;
      if (currentMode === "3digit") {
        // Base range ~5 to 22 => Apex ~250 to 900
        minBase = 5;
        maxBase = 22;
      } else {
        // Base range ~40 to 220 => Apex ~1,500 to 9,500 (strictly under 9999)
        minBase = 40;
        maxBase = 220;
      }

      // Generate random Tier 6 (base of 6 items)
      const baseTier = [];
      for (let i = 0; i < 6; i++) {
        baseTier.push(Math.floor(Math.random() * (maxBase - minBase + 1)) + minBase);
      }

      // Build 2D pyramid array bottom-up
      const tiers = [];
      tiers[5] = baseTier;

      for (let t = 4; t >= 0; t--) {
        tiers[t] = [];
        for (let i = 0; i <= t; i++) {
          tiers[t][i] = tiers[t + 1][i] + tiers[t + 1][i + 1];
        }
      }

      // Flatten into 21-element currentValues array
      let flatIdx = 0;
      for (let t = 0; t < 6; t++) {
        for (let i = 0; i <= t; i++) {
          currentValues[flatIdx++] = tiers[t][i];
        }
      }

      // Curated solvable clue masks for 6-tier pyramids:
      // Exactly 6 strategic clues given (1 per diagonal/column constraint)
      const solvablePresets = [
        // Pattern 1: Apex + staggered staircases
        [0, 2, 5, 9, 14, 18],
        // Pattern 2: Apex + interior pivots
        [0, 1, 4, 8, 12, 19],
        // Pattern 3: Top-middle-base balanced
        [0, 2, 4, 7, 13, 20],
        // Pattern 4: Alternating wings
        [0, 1, 5, 6, 12, 17],
        // Pattern 5: Inside anchors
        [0, 2, 3, 9, 11, 20]
      ];

      const chosenPreset = solvablePresets[Math.floor(Math.random() * solvablePresets.length)];
      revealedMask = new Array(21).fill(false);
      chosenPreset.forEach(idx => {
        revealedMask[idx] = true;
      });

      renderSlots();

      const statusEl = document.getElementById("status");
      statusEl.textContent = "";
      statusEl.className = "status-banner";
      updateProgress();
    }

    function renderSlots() {
      const slots = document.querySelectorAll(".cell-slot");

      slots.forEach(slot => {
        const idx = parseInt(slot.dataset.idx, 10);
        const isRevealed = revealedMask[idx];
        const val = currentValues[idx];

        slot.innerHTML = "";

        if (isRevealed) {
          const div = document.createElement("div");
          div.className = "block-given";
          div.textContent = val;
          slot.appendChild(div);
        } else {
          const input = document.createElement("input");
          input.type = "text";
          input.inputMode = "numeric";
          input.maxLength = 5;
          input.className = "block-input";
          input.dataset.idx = idx;

          input.addEventListener("input", handleInput);
          input.addEventListener("keydown", handleKeydown);
          slot.appendChild(input);
        }
      });

      const firstInput = document.querySelector("input.block-input");
      if (firstInput) firstInput.focus();
    }

    function handleKeydown(e) {
      if (e.key === "Enter") {
        const inputs = Array.from(document.querySelectorAll("input.block-input"));
        const cur = inputs.indexOf(e.target);
        if (cur < inputs.length - 1) inputs[cur + 1].focus();
      }
      if (e.key === "Backspace" && !e.target.value) {
        const inputs = Array.from(document.querySelectorAll("input.block-input"));
        const cur = inputs.indexOf(e.target);
        if (cur > 0) inputs[cur - 1].focus();
      }
    }

    function handleInput(e) {
      e.target.value = e.target.value.replace(/[^0-9]/g, "");
      checkPuzzle();
    }

    function checkPuzzle() {
      const inputs = Array.from(document.querySelectorAll("input.block-input"));
      const statusEl = document.getElementById("status");
      let allCorrect = true;
      let allFilled = true;
      let solved = 0;

      inputs.forEach(inp => {
        const idx = parseInt(inp.dataset.idx, 10);
        const entered = parseInt(inp.value, 10);

        if (!inp.value) {
          allFilled = false;
          allCorrect = false;
          inp.classList.remove("correct");
        } else if (entered === currentValues[idx]) {
          inp.classList.add("correct");
          solved++;
        } else {
          inp.classList.remove("correct");
          allCorrect = false;
        }
      });

      if (allFilled && allCorrect) {
        statusEl.textContent = "🏆 Mastermind! 6-Tier Pyramid Conquered! 🏆";
        statusEl.className = "status-banner win";
      } else {
        statusEl.textContent = "";
        statusEl.className = "status-banner";
      }
      updateProgress(solved, inputs.length);
    }

    function updateProgress(solved = 0, total = document.querySelectorAll("input.block-input").length) {
      const copy = document.getElementById("progress-copy");
      const fill = document.getElementById("progress-fill");
      copy.textContent = `${solved} of ${total} solved`;
      fill.style.width = total ? `${(solved / total) * 100}%` : "0%";
    }

    // Toggle button events
    const btn3 = document.getElementById("btn-mode-3");
    const btn4 = document.getElementById("btn-mode-4");

    btn3.addEventListener("click", () => {
      if (currentMode !== "3digit") {
        currentMode = "3digit";
        btn3.classList.add("active");
        btn4.classList.remove("active");
        generatePyramid();
      }
    });

    btn4.addEventListener("click", () => {
      if (currentMode !== "4digit") {
        currentMode = "4digit";
        btn4.classList.add("active");
        btn3.classList.remove("active");
        generatePyramid();
      }
    });

    document.getElementById("btn-clear").addEventListener("click", () => {
      document.querySelectorAll("input.block-input").forEach(inp => {
        inp.value = "";
        inp.classList.remove("correct");
      });
      document.getElementById("status").textContent = "";
      updateProgress();
      const firstInput = document.querySelector("input.block-input");
      if (firstInput) firstInput.focus();
    });

    document.getElementById("btn-new").addEventListener("click", generatePyramid);

    // Initial render
    generatePyramid();
  </script>
</body>
</html>
